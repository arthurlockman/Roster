name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1). A 'v'-prefixed tag will be created."
        required: true
        type: string

permissions:
  contents: write

# Required repository secrets (all optional — steps that need them are skipped
# automatically when the secret is unset):
#
#   DEVELOPER_ID_P12_BASE64     Base64-encoded Developer ID Application .p12.
#                               Export from Keychain Access → "Developer ID Application: …"
#                               then: base64 -i Certificate.p12 | pbcopy
#
#   DEVELOPER_ID_P12_PASSWORD   Password used when exporting the .p12.
#
#   DEVELOPMENT_TEAM            Apple Developer Team ID for signing (e.g. 7E57633U38).
#
#   NOTARY_KEY                  App Store Connect API private key (.p8 file contents).
#                               Generate at https://appstoreconnect.apple.com/access/integrations/api
#                               Must be a Team key with "Developer" permission.
#
#   NOTARY_KEY_ID               The 10-character Key ID from App Store Connect.
#
#   NOTARY_ISSUER_ID            The Issuer ID (UUID) from App Store Connect.
#
#   SPARKLE_PRIVATE_KEY         EdDSA (ed25519) private key for Sparkle update signing.
#                               Generate/export with: generate_keys -x private_key_file

env:
  SCHEME: Roster
  APP_NAME: Roster
  PROJECT: RosterApp/Roster.xcodeproj
  ARCHIVE_PATH: build/Roster.xcarchive
  # Secrets bound to env so `env.X != ''` guards work per step
  DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
  DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
  DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
  NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
  NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
  NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
  SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
  # Sparkle signing tool version (independent of app integration)
  SPARKLE_VERSION: "2.10.1"


jobs:
  release:
    name: Build & Release
    runs-on: xcode-27
    steps:
      # ── Check out ──────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Determine version ──────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"  >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # ── Select latest Xcode ────────────────────────────────────
      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$latest" ]]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          echo "Active SDK: $(xcrun --show-sdk-version)"
          echo "Swift: $(swift --version 2>&1 | head -1)"

      # ── Import signing certificate (optional) ──────────────────
      - name: Import signing certificate
        if: env.DEVELOPER_ID_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      # ── Build number ───────────────────────────────────────────
      # GitHub's auto-incrementing run number keeps builds monotonic
      # across releases so Sparkle's sparkle:version comparison works.
      - name: Compute build number
        id: buildnum
        run: |
          # Offset so release builds always exceed previously distributed
          # builds (Sparkle compares sparkle:version). Local dev builds have
          # reached CFBundleVersion 6; +100 keeps releases safely above.
          build_number=$(( ${{ github.run_number }} + 100 ))
          echo "value=$build_number" >> "$GITHUB_OUTPUT"
          echo "Build number: $build_number"

      # ── Resolve packages ───────────────────────────────────────
      # Pre-fetch Sparkle's SPM package so archive/export are stable.
      - name: Resolve Swift packages
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            | tee build/packages.log

      # ── Archive ────────────────────────────────────────────────
      # Archive with manual Developer ID signing (like Shifty); without
      # signing secrets, produce an unsigned dry-run archive.
      - name: Archive
        run: |
          set -o pipefail
          sign_args=()
          if [[ -n "$DEVELOPER_ID_P12_BASE64" ]]; then
            sign_args+=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="Developer ID Application"
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"
            )
          else
            sign_args+=(CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild archive \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            "${sign_args[@]}" \
            CURRENT_PROJECT_VERSION="${{ steps.buildnum.outputs.value }}" \
            | tee build/archive.log

      # ── Export ─────────────────────────────────────────────────
      # Developer-id export re-signs every embedded framework (Sparkle)
      # with Developer ID and strips get-task-allow. Without secrets,
      # copy the unsigned archive product so the dry run still produces
      # a zip.
      - name: Export archive
        run: |
          set -o pipefail
          mkdir -p build/export
          cat > /tmp/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ env.DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          if [[ -n "$DEVELOPER_ID_P12_BASE64" ]]; then
            xcodebuild -exportArchive \
              -archivePath "${{ env.ARCHIVE_PATH }}" \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              -exportPath build/export \
              | tee build/export.log
          else
            cp -R "${{ env.ARCHIVE_PATH }}/Products/Applications/${{ env.APP_NAME }}.app" \
              "build/export/${{ env.APP_NAME }}.app"
          fi

      # ── Minimum system version (from the exported app) ─────────
      # Read from the exported app's Info.plist so the appcast can never
      # drift from what the binary actually requires.
      - name: Determine minimum system version
        id: minsys
        run: |
          v=$(plutil -extract LSMinimumSystemVersion raw -o - \
            "build/export/${{ env.APP_NAME }}.app/Contents/Info.plist")
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Minimum system version: $v"

      # ── Distributability gate ──────────────────────────────────
      # Only a signed AND notarized build may reach end-user updaters
      # through the Sparkle feed; anything less stays GitHub-only.
      - name: Determine distributability
        id: distributable
        run: |
          if [[ -n "$DEVELOPER_ID_P12_BASE64" && -n "$NOTARY_KEY" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "Build will be signed and notarized — appcast will be updated."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing DEVELOPER_ID_P12_BASE64 and/or NOTARY_KEY — build will ship as an unsigned/limited test release."
          fi

      # ── Notarize (optional) ────────────────────────────────────
      - name: Create zip for notarization
        if: env.NOTARY_KEY != ''
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/${{ env.APP_NAME }}.app" \
            "build/${{ env.APP_NAME }}-notarize.zip"

      - name: Write API key for notarization
        if: env.NOTARY_KEY != ''
        run: |
          mkdir -p ~/.private_keys
          echo '${{ secrets.NOTARY_KEY }}' > ~/.private_keys/AuthKey_${{ secrets.NOTARY_KEY_ID }}.p8

      - name: Submit for notarization
        if: env.NOTARY_KEY != ''
        run: |
          xcrun notarytool submit "build/${{ env.APP_NAME }}-notarize.zip" \
            --key ~/.private_keys/AuthKey_${{ secrets.NOTARY_KEY_ID }}.p8 \
            --key-id "${{ secrets.NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_ID }}" \
            --wait --timeout 30m

      - name: Staple notarization ticket
        if: env.NOTARY_KEY != ''
        run: |
          app_path="build/export/${{ env.APP_NAME }}.app"
          ok=0
          for attempt in 1 2 3 4; do
            if xcrun stapler staple "$app_path"; then
              ok=1
              break
            fi
            echo "::warning::stapler staple failed (attempt $attempt) — ticket may not have propagated yet; retrying in 30s"
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Could not staple notarization ticket after 4 attempts"
            exit 1
          fi

      - name: Verify notarization
        if: env.NOTARY_KEY != ''
        run: |
          xcrun stapler validate "build/export/${{ env.APP_NAME }}.app"
          spctl -a -vvv --type exec "build/export/${{ env.APP_NAME }}.app"

      # ── Package final artifact ─────────────────────────────────
      # Zip the stapled export so the release asset carries the ticket.
      - name: Create release zip
        run: |
          version="${{ steps.version.outputs.value }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/${{ env.APP_NAME }}.app" \
            "build/${{ env.APP_NAME }}-${version}.zip"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log

      # ── Sparkle signing (optional) ─────────────────────────────
      # Uses sign_update from the resolved Sparkle SPM package
      # (already fetched for the build), like Shifty.
      - name: Sign update for Sparkle
        if: env.SPARKLE_PRIVATE_KEY != '' && steps.distributable.outputs.value == 'true'
        id: sparkle
        run: |
          version="${{ steps.version.outputs.value }}"
          SIGN_TOOL="build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"

          signature=$(echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" \
            | "$SIGN_TOOL" "build/${{ env.APP_NAME }}-${version}.zip" --ed-key-file -)

          # signature output is like: sparkle:edSignature="..." length="..."
          ed_signature=$(echo "$signature" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          length=$(echo "$signature" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          echo "ed_signature=$ed_signature" >> "$GITHUB_OUTPUT"
          echo "length=$length" >> "$GITHUB_OUTPUT"
          echo "Sparkle signature generated (length: $length)"

      # ── Create tag (workflow_dispatch only) ────────────────────
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

      # ── Publish release ────────────────────────────────────────
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="${{ steps.version.outputs.tag }}"
          asset="build/${{ env.APP_NAME }}-${version}.zip"

          # A build that is not signed AND notarized is not fit for normal
          # outside-App-Store installation; label it as an unsigned/limited
          # test with a prerelease marker so end-user updaters aren't
          # pointed at it as a stable release.
          extra_args=(--title "${{ env.APP_NAME }} $version")
          if [[ -z "$DEVELOPER_ID_P12_BASE64" || -z "$NOTARY_KEY" ]]; then
            echo "::warning::Release is not signed+notarized (missing DEVELOPER_ID_P12_BASE64 and/or NOTARY_KEY secrets) — publishing as prerelease."
            extra_args+=(--prerelease --title "${{ env.APP_NAME }} $version (test build — unsigned or not notarized)")
          fi

          gh release create "$tag" "$asset" \
            "${extra_args[@]}" \
            --generate-notes

      # ── Update Sparkle appcast (optional) ──────────────────────
      - name: Update and publish appcast
        if: env.SPARKLE_PRIVATE_KEY != '' && steps.distributable.outputs.value == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.value }}
          ED_SIGNATURE: ${{ steps.sparkle.outputs.ed_signature }}
          ZIP_LENGTH: ${{ steps.sparkle.outputs.length }}
          APP_NAME: ${{ env.APP_NAME }}
          MINIMUM_SYSTEM_VERSION: ${{ steps.minsys.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          python3 - <<'PYEOF'
          import os, datetime

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          build = os.environ["BUILD_NUMBER"]
          sig = os.environ["ED_SIGNATURE"]
          length = os.environ["ZIP_LENGTH"]
          app = os.environ["APP_NAME"]
          min_sys = os.environ["MINIMUM_SYSTEM_VERSION"]
          repo = os.environ.get("GITHUB_REPOSITORY", "arthurlockman/Roster")
          url = f"https://github.com/{repo}/releases/download/{tag}/{app}-{version}.zip"
          pub_date = datetime.datetime.now(datetime.timezone.utc).strftime("%a, %d %b %Y %H:%M:%S %z")

          import re
          is_prerelease = bool(re.search(r'-(alpha|beta|rc)', version, re.IGNORECASE))
          channel_line = "\n            <sparkle:channel>beta</sparkle:channel>" if is_prerelease else ""

          appcast_path = "docs/appcast.xml"
          os.makedirs("docs", exist_ok=True)
          # Read raw XML to preserve formatting; create it if missing
          try:
              with open(appcast_path, "r") as f:
                  content = f.read()
          except FileNotFoundError:
              content = f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>{app}</title>
                  <link>https://github.com/{repo}/releases</link>
                  <description>Most recent {app} releases</description>
                  <language>en</language>
              </channel>
          </rss>
          """

          # sparkle:version = CFBundleVersion (monotonic build number)
          # sparkle:shortVersionString = CFBundleShortVersionString (marketing version)
          new_item = f"""        <item>
              <title>Version {version}</title>
              <pubDate>{pub_date}</pubDate>{channel_line}
              <enclosure url="{url}" sparkle:version="{build}" sparkle:shortVersionString="{version}" length="{length}" type="application/octet-stream" sparkle:edSignature="{sig}" />
              <sparkle:minimumSystemVersion>{min_sys}</sparkle:minimumSystemVersion>
          </item>"""

          marker = "<language>en</language>"
          content = content.replace(marker, marker + "\n" + new_item)

          with open(appcast_path, "w") as f:
              f.write(content)

          print(f"Appcast updated for v{version} (build {build})")
          PYEOF

          git add docs/appcast.xml
          git commit -m "Update appcast for v${RELEASE_VERSION}"
          git push origin main
